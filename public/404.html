<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <script>
    sessionStorage.setItem('gh-pages-redirect', location.pathname + location.search + location.hash);
    var segments = location.pathname.split('/');
    var base = '/' + (segments[1] || '') + '/';
    location.replace(base);
  </script>
</head>
<body></body>
</html>
